# TinyProxy 联通免流 conf（针对你截图 HTTPS 失败的修复版）
# 问题：HTTP/HTTPS 都写成了 CDN IP 220.205.125.35
# 原因：该 IP 是 TLS 视频 CDN，不是 443 上的 HTTP 注入网关
# 修复：http_ip 用 CDN；https_ip 用网关型 14.215.182.75

listen_port=65080;
worker_proc=0;
daemon=on;
uid=3004;
mode=net;

# HTTP：视频 CDN（当前解析到的可用节点，路径请求实测 200）
http_ip=220.205.125.35;
http_port=80;
http_del="X-Online-Host";
http_first="[M]http://chinaunicom-playe-free.10010.com/videoworks/mda-mfqg4w0xr7mr536n/unicom_work_pro/transcode/162373672496113.mp4 [V]\r\n";

# HTTPS：必须用「443 上接受明文 HTTP/Host 注入」的网关 IP
# 不要填 pull.free.video 的 DNS 解析结果（那是 TLS CDN）
https_connect=on;
https_ip=14.215.182.75;
https_port=443;
https_del="User-Agent";
https_first="[M][H]@pull.free.video.10010.com [V]\r\n";

dns_tcp=http;
dns_listen_port=65053;
dns_url="119.29.29.29";
